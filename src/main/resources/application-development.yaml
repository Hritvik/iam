# Local development runtime. Every credential is injected from the environment; nothing here is a
# committed secret. See docs/identity-platform/deployment/local-runtime.md.
spring:
  datasource:
    url: ${IAM_DB_URL}
    username: ${IAM_DB_USERNAME:iam_runtime}
    password: ${IAM_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${IAM_DB_POOL_SIZE:10}
      minimum-idle: ${IAM_DB_MIN_IDLE:2}
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    enabled: true
    url: ${IAM_FLYWAY_URL:${IAM_DB_URL}}
    user: ${IAM_FLYWAY_USERNAME:iam_migrator}
    password: ${IAM_FLYWAY_PASSWORD}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

iam:
  environment: development
  issuer: ${IAM_ISSUER:https://iam.example.test}
  registration:
    dutch-development:
      enabled: ${IAM_REGISTRATION_ENABLED:false}
    reconciler:
      jdbc-url: ${IAM_RECONCILER_URL:${IAM_DB_URL}}
      username: ${IAM_RECONCILER_USERNAME:iam_registration_reconciler}
      password: ${IAM_RECONCILER_PASSWORD}
  crypto:
    local:
      enabled: ${IAM_CRYPTO_LOCAL_ENABLED:false}
      provider: ${IAM_CRYPTO_LOCAL_PROVIDER:local-jca}
      signer-key-id: ${IAM_CRYPTO_LOCAL_SIGNER_KEY_ID:local-signing-v1}
      signer-private-key: ${IAM_CRYPTO_LOCAL_SIGNER_PRIVATE_KEY:}
      identifier-encryption-key-reference: ${IAM_CRYPTO_LOCAL_ENCRYPTION_KEY_REFERENCE:local-encryption-v1}
      identifier-encryption-key: ${IAM_CRYPTO_LOCAL_ENCRYPTION_KEY:}
      identifier-encryption-key-version: ${IAM_CRYPTO_LOCAL_ENCRYPTION_KEY_VERSION:1}
      blind-index-key-reference: ${IAM_CRYPTO_LOCAL_BLIND_INDEX_KEY_REFERENCE:local-blind-index-v1}
      blind-index-key: ${IAM_CRYPTO_LOCAL_BLIND_INDEX_KEY:}
      blind-index-key-version: ${IAM_CRYPTO_LOCAL_BLIND_INDEX_KEY_VERSION:1}
      challenge-digest-key-reference: ${IAM_CRYPTO_LOCAL_CHALLENGE_DIGEST_KEY_REFERENCE:local-challenge-digest-v1}
      challenge-digest-key: ${IAM_CRYPTO_LOCAL_CHALLENGE_DIGEST_KEY:}
      challenge-digest-key-version: ${IAM_CRYPTO_LOCAL_CHALLENGE_DIGEST_KEY_VERSION:1}
  fixtures:
    deterministic-identity:
      enabled: ${IAM_FIXTURES_ENABLED:false}
  messaging:
    enabled: ${IAM_MESSAGING_ENABLED:false}
    relay:
      enabled: ${IAM_RELAY_ENABLED:false}
      owner: ${IAM_RELAY_OWNER:iam-relay-1}
      jdbc-url: ${IAM_RELAY_URL:${IAM_DB_URL}}
      username: ${IAM_RELAY_USERNAME:iam_relay}
      password: ${IAM_RELAY_PASSWORD}
      transport:
        mode: ${IAM_RELAY_TRANSPORT:http}
        endpoint: ${IAM_RELAY_ENDPOINT:https://ums.example.test/internal/v1/iam/events}
        workload-id: ${IAM_WORKLOAD_ID:wl_localdevelopmentrelay01}
        audience: ${IAM_WORKLOAD_AUDIENCE:https://ums.example.test/internal/iam/events}
        scope: ${IAM_WORKLOAD_SCOPE:ums:onboarding:write}
        connect-timeout-ms: ${IAM_RELAY_CONNECT_TIMEOUT_MS:2000}
        request-timeout-ms: ${IAM_RELAY_REQUEST_TIMEOUT_MS:5000}
      schedule:
        enabled: ${IAM_RELAY_SCHEDULE_ENABLED:false}
        interval-ms: ${IAM_RELAY_INTERVAL_MS:5000}
  workload:
    enabled: ${IAM_WORKLOAD_ENABLED:false}
    issuer: ${IAM_ISSUER:https://iam.example.test}
    lifetime-seconds: ${IAM_WORKLOAD_LIFETIME_SECONDS:300}
    skew-seconds: ${IAM_WORKLOAD_SKEW_SECONDS:30}
    signing:
      key-id: ${IAM_WORKLOAD_KEY_ID:local-workload-v1}
      private-key: ${IAM_WORKLOAD_SIGNING_PRIVATE_KEY:}
      public-key: ${IAM_WORKLOAD_SIGNING_PUBLIC_KEY:}
    trusted-keys:
      - key-id: ${IAM_WORKLOAD_KEY_ID:local-workload-v1}
        public-key: ${IAM_WORKLOAD_SIGNING_PUBLIC_KEY:}
    bindings:
      - workload-id: ${IAM_WORKLOAD_ID:wl_localdevelopmentrelay01}
        app-registration-id: ${IAM_WORKLOAD_APP_ID:dutch-development}
        client-id: ${IAM_WORKLOAD_CLIENT_ID:iam-relay}
        audiences:
          - ${IAM_WORKLOAD_AUDIENCE:https://ums.example.test/internal/iam/events}
          - https://iam.distracted.invalid/internal/onboarding
        scopes:
          - ${IAM_WORKLOAD_SCOPE:ums:onboarding:write}
          - iam:onboarding:read
        security-version: ${IAM_WORKLOAD_SECURITY_VERSION:1}
