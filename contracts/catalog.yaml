    path: http/iam-onboarding-snapshot.openapi.yaml
  - name: event-envelope
    kind: json-schema
    schemaVersion: 1.0.0
    path: events/event-envelope.schema.json
  - name: iam.app-subject.onboarding-ready.v1
    kind: json-schema
    schemaVersion: 1.0.0
    path: events/iam.app-subject.onboarding-ready.v1.schema.json
  - name: iam.app-subject.onboarding-ready.v1-payload
    kind: json-schema
    schemaVersion: 1.0.0
    path: events/iam.app-subject.onboarding-ready.v1.payload.schema.json
  - name: semantic-conformance-requirements
    kind: requirements
    schemaVersion: 1.0.0
    path: conformance/semantic-requirements.yaml
