    kind: example
    schemaVersion: 1.0.0
    path: manifest/dutch-development.app-registration.json
    schema: https://contracts.distracted.dev/iam/manifest/app-registration.schema.json
  - name: product-security-policy
    kind: json-schema
    schemaVersion: 1.0.0
    path: manifest/product-security-policy.schema.json
  - name: human-access-token-header
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/human-access-token-header.schema.json
  - name: authorization-server-metadata
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/authorization-server-metadata.schema.json
  - name: jwks
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/jwks.schema.json
  - name: protected-resource-metadata
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/protected-resource-metadata.schema.json
  - name: human-access-token-claims
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/human-access-token-claims.schema.json
  - name: workload-access-token-header
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/workload-access-token-header.schema.json
  - name: workload-access-token-claims
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/workload-access-token-claims.schema.json
  - name: dpop-proof-header
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/dpop-proof-header.schema.json
  - name: token-endpoint-dpop-proof-claims
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/dpop-proof-claims.schema.json
  - name: dpop-token-response
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/token-response.schema.json
  - name: oauth-token-error-response
    kind: json-schema
    schemaVersion: 1.0.0
    path: oauth/token-error-response.schema.json
  - name: onboarding-snapshot-response
    kind: json-schema
    schemaVersion: 1.0.0
    path: http/onboarding-snapshot-response.schema.json
